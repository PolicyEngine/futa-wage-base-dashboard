name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_TELEMETRY_DISABLED: '1'

  analysis-consistency:
    name: Analysis outputs agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: results.json copies are identical
        run: cmp analysis/futa_results.json frontend/lib/results.json
      - name: adjustments.json copies are identical
        run: cmp analysis/futa_adjustments.json frontend/lib/adjustments.json
      - name: CSV rows match results.json
        run: |
          python3 - <<'EOF'
          import csv, json
          d = json.load(open("analysis/futa_results.json"))
          rows = {r["year"]: r for r in d["results"] if "wage_base" in r}
          with open("analysis/futa_wage_base_estimates.csv") as f:
              csv_rows = list(csv.DictReader(f))
          assert [int(r["calendar_year"]) for r in csv_rows] == sorted(rows), "years differ"
          for c in csv_rows:
              r = rows[int(c["calendar_year"])]
              assert int(c["taxable_wage_base_usd"]) == r["wage_base"]
              assert int(c["baseline_revenue_usd"]) == round(r["baseline_revenue_flat_06"])
              assert int(c["reform_revenue_usd"]) == round(r["reform_revenue_flat_06"])
              assert int(c["additional_revenue_usd"]) == round(r["additional_revenue_flat_06"])
          print("CSV matches results.json for", len(csv_rows), "years")
          EOF
